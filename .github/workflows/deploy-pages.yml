name: Publicar MM no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Definir endereço e caminho do site
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            base="/"
            site="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            base="/${repo}/"
            site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo}"
          fi
          echo "VITE_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=$site" >> "$GITHUB_ENV"
      - name: Instalar dependências
        run: npm ci
      - name: Compilar o portal
        run: npm run build
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
